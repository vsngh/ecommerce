name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cart
            project: services/cart/Cart.Api.csproj
            tests: services/cart/tests/Cart.Api.Tests.csproj
          - service: gateway
            project: services/gateway/Gateway.Api.csproj
            tests: ''
          - service: inventory
            project: services/inventory/Inventory.Api.csproj
            tests: services/inventory/tests/Inventory.Api.Tests.csproj
          - service: orders
            project: services/orders/Orders.Api.csproj
            tests: services/orders/tests/Orders.Api.Tests.csproj
          - service: payments
            project: services/payments/Payments.Api.csproj
            tests: services/payments/tests/Payments.Api.Tests.csproj
          - service: products
            project: services/products/Products.Api.csproj
            tests: services/products/tests/Products.Api.Tests.csproj
          - service: users
            project: services/users/Users.Api.csproj
            tests: services/users/tests/Users.Api.Tests.csproj

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        if: matrix.tests != ''
        run: dotnet test "${{ matrix.tests }}" --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage report
        if: matrix.tests != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Build gateway
        if: matrix.tests == ''
        run: dotnet build "${{ matrix.project }}" --configuration Release

      - name: Build container image
        run: docker build --tag "ecommerce-${{ matrix.service }}:ci" "./services/${{ matrix.service }}"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build frontend container image
        run: docker build --tag ecommerce-frontend:ci .
