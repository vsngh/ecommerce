openapi: 3.0.3
info:
  title: Order Cancellation Contract
  version: 1.0.0
paths:
  /api/orders/{orderId}/cancel:
    patch:
      summary: Cancel the authenticated customer's Pending order
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The payment state was recorded and the order was cancelled
        "401":
          description: The caller is not authenticated or has no valid user identity
        "404":
          description: The order does not exist or is not owned by the caller
        "409":
          description: The order is not Pending
        "503":
          description: Payment state could not be recorded; the order remains Pending
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
